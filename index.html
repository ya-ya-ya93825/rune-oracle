<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111513"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png"><title>RUNE ORACLE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29261d,#101412 65%);color:#e5c88f;font-family:Georgia,serif;min-height:100dvh;text-align:center}main{max-width:850px;margin:auto;padding:24px 12px}h1{letter-spacing:.17em;font-weight:normal;margin:18px 0 6px}p{color:#d0c4ac;font-size:14px}button{font:inherit;color:inherit;background:#191e1a;border:1px solid #92764a;border-radius:9px;padding:12px 16px;cursor:pointer}button:focus-visible{outline:2px solid white}nav{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:24px 0}nav button.active{background:#70552c;color:#fff}#board{display:flex;justify-content:center;gap:9px;align-items:flex-start;margin:20px auto}article{flex:1;min-width:0;max-width:290px}article h3{font-size:15px;font-weight:normal}.card{display:block;width:100%;aspect-ratio:2/3;padding:0;overflow:hidden;border-radius:9px;position:relative;background:radial-gradient(circle,#302a1d,#111713);box-shadow:0 5px 18px #0008}.card img{width:100%;height:100%;object-fit:contain;display:block}.back{position:absolute;inset:5%;border:1px solid #a48750;display:grid;place-content:center;font-size:clamp(30px,9vw,70px);outline:1px solid #655333;outline-offset:-5px}.reveal{animation:flip .45s ease}@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}.meaning{font-size:13px;line-height:1.7;overflow-wrap:anywhere}#board.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:14px}dialog{background:#171b17;color:#e5c88f;border:1px solid #b79b63;border-radius:12px;max-width:90vw;text-align:center}dialog img{display:block;max-height:65dvh;max-width:100%;margin:auto}footer{font-size:11px;color:#a69b83;margin-top:30px}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}main{max-width:520px;padding:calc(20px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}h1{font-size:clamp(23px,7vw,32px)}button{min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}nav{gap:6px}nav button{padding:10px 9px;font-size:14px}#board.one article{max-width:260px}#board.three article{max-width:155px}#board.three{gap:7px}.card img.reverse,dialog img.reverse{transform:rotate(180deg)}.position{display:block;color:#f2d598;font-weight:bold;margin-bottom:4px}.meaning{font-size:12px}dialog{width:min(90vw,390px);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}dialog img{max-height:58vh}#share{margin-top:14px}#offline{font-size:11px}footer{line-height:1.7}body{min-height:100vh;min-height:100dvh}</style><main><header>✦　ᚠ ᚢ ᚦ　✦<h1>RUNE ORACLE</h1><p>運命を紐解く25枚のルーン</p></header><nav><button data-mode="one">一枚引き</button><button data-mode="three">三枚引き</button><button data-mode="library">ルーン図鑑</button></nav><p id="hint"></p><section id="board"></section><button id="again">もう一度占う</button><div><button id="share" hidden>アプリを共有</button></div><p id="offline" role="status"></p><footer>Ver.2.0 · ELDER FUTHARK + WYRD · 25 CARDS<br>逆位置の意味は本アプリ独自の参考解釈です。<br>占いは自己理解のための参考としてお楽しみください。</footer></main><dialog id="detail"><img alt=""><h2></h2><p></p><p id="reverseInfo"></p><button onclick="this.closest('dialog').close()">閉じる</button></dialog><script>const cards=[["フェオ", "富・財産", "0.webp", "損失・浪費・財産への執着"], ["ウル", "意志・決断力・活力", "1.webp", "意志の弱まり・活力不足・迷い"], ["ソーン", "衝動・恨み・負のエネルギー", "2.webp", "軽率な行動・対立・内向きの怒り"], ["アンスール", "知恵・知識の伝承・天恵", "3.webp", "誤解・情報不足・助言の見直し"], ["ラド", "さすらい・行動・旅", "4.webp", "計画の遅れ・方向性の迷い"], ["ケン", "情熱・新しい始まり", "5.webp", "情熱の低下・停滞・再考"], ["ギューフ", "贈り物・愛情・幸福への祈り", "6.webp", null], ["ウィン", "忍耐の先の幸福・栄光", "7.webp", "失望・不調和・焦り"], ["ハガル", "試練・誤った道・苦難", "8.webp", null], ["ニィド", "欠乏・忍耐・停滞", "9.webp", null], ["イス", "停止・閉ざされる・終わり", "10.webp", null], ["ヤラ", "収穫・実り・努力の結晶", "11.webp", null], ["ユル", "終わりから始まり・死から生", "12.webp", null], ["ペオース", "偶然の幸運・新たな発見", "13.webp", "予想外の展開・秘密・慎重さ"], ["エオロー", "保護・跳ねのけ・友情", "14.webp", "無防備・信頼の見直し"], ["シゲル", "成就・希望・活力", "15.webp", null], ["ティール", "道しるべ・闘争心・勇気", "16.webp", "勇気の低下・方向性の迷い"], ["ベオーク", "母性・家族愛・庇護", "17.webp", "過干渉・家族間の不調和・成長の遅れ"], ["エオー", "迅速・進展", "18.webp", "進展の遅れ・連携不足"], ["マン", "社会・信頼・安定", "19.webp", "孤立・不信・協調の不足"], ["ラーグ", "感受性・想像力・心の充足", "20.webp", "感情の混乱・想像への偏り"], ["イング", "頂点・大きな実り・進展", "21.webp", null], ["オセル", "土地・建物・真面目・慣習", "22.webp", "基盤の不安定・慣習への執着"], ["ダエグ", "確実な前進・堅実・成長", "23.webp", null], ["ウィルド", "運命", "24.webp", null]];let mode='one';const board=document.querySelector('#board'),hint=document.querySelector('#hint'),again=document.querySelector('#again'),detail=document.querySelector('#detail');function random(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}function draw(){let a=cards.slice();for(let i=a.length-1;i>0;i--){let j=random(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function img(c,rev=false){let i=document.createElement('img');i.src=c[2];i.alt=c[0]+(rev?'（逆位置）':'');i.classList.toggle('reverse',rev);return i}function show(c,rev=false,library=false){const im=detail.querySelector('img');im.src=c[2];im.alt=c[0];im.classList.toggle('reverse',rev);detail.querySelector('h2').textContent=c[0]+(library?'':c[3]?(rev?' · 逆位置':' · 正位置'):' · 位置区別なし');detail.querySelector('p').textContent=(library?'正位置：':'')+(rev?c[3]:c[1]);detail.querySelector('#reverseInfo').textContent=library?(c[3]?'逆位置：'+c[3]:'逆位置の区別なし'):'';detail.showModal()}function render(){board.replaceChildren();board.className=mode;again.hidden=mode==='library';hint.textContent=mode==='library'?'カードをタップして詳細を表示': '心を落ち着かせ、カードをタップしてください。';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let list=mode==='library'?cards:draw().slice(0,mode==='one'?1:3);list.forEach((c,i)=>{let a=document.createElement('article'),h=document.createElement('h3'),b=document.createElement('button'),m=document.createElement('p');h.textContent=mode==='library'?c[0]:mode==='one'?'メッセージ':['過去','現在','未来'][i];b.className='card';m.className='meaning';a.append(h,b,m);board.append(a);if(mode==='library'){b.append(img(c));b.onclick=()=>show(c,false,true)}else{b.innerHTML='<span class="back">✧</span>';b.setAttribute('aria-label',h.textContent+'のカードを開く');const rev=!!c[3]&&random(2)===1;let opened=false;b.onclick=()=>{if(opened){show(c,rev);return}opened=true;b.replaceChildren(img(c,rev));b.classList.add('reveal');b.setAttribute('aria-label',c[0]+'の詳細');const pos=document.createElement('span');pos.className='position';pos.textContent=c[3]?(rev?'逆位置':'正位置'):'位置区別なし';m.replaceChildren(pos,document.createTextNode(c[0]+' — '+(rev?c[3]:c[1])))}}})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});again.onclick=render;render();const share=document.querySelector('#share'),offline=document.querySelector('#offline');if(location.protocol==='https:'||location.protocol==='http:'){share.hidden=false;share.onclick=async()=>{const url=new URL('./',location.href).href;try{if(navigator.share)await navigator.share({title:'RUNE ORACLE',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);offline.textContent='共有URLをコピーしました。'}else prompt('共有URL',url)}catch(e){if(e.name!=='AbortError')prompt('共有URL',url)}};if('serviceWorker'in navigator){offline.textContent='オフライン用データを準備中…';navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{offline.textContent='オフライン利用の準備完了'}).catch(()=>{offline.textContent='オフライン準備に失敗しました。再読み込みしてください。'})}}else{offline.textContent='単体HTML版 · 通信不要'}</script></html>
